- name: Configure Gateway LXC for Phase 1 (Tailscale Only)
  hosts: gateway
  become: true

  tasks:
    - name: Ensure basic networking tools and Tailscale are installed
      community.general.apk:
        name:
          - iptables
          - iproute2
          - tailscale
        state: present

    - name: Enable IP Forwarding in kernel settings
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Enable NAT/Masquerading on eth0 for internal subnet
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: eth0
        source: 10.0.0.0/24
        jump: MASQUERADE
        comment: "NAT traffic from internal network to WAN"
      notify: Save iptables rules

    - name: Ensure Tailscale service is enabled and started
      ansible.builtin.service:
        name: tailscale
        enabled: true
        state: started

  handlers:
    - name: Save iptables rules
      ansible.builtin.shell: |
        rc-update add iptables default
        mkdir -p /etc/iptables
        iptables-save -t nat > /etc/iptables/rules-v4
