- name: Configure Ubuntu-Server Application
  hosts: application
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add rioly user to docker group
      ansible.builtin.user:
        name: rioly
        groups: docker
        append: true

    - name: Create main apps directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: rioly
        group: rioly
        mode: '0755'
      loop:
        - /home/rioly/apps
        - /home/rioly/apps/dynamic

    - name: Ensure acme.json exists with strict permissions
      ansible.builtin.file:
        path: /home/rioly/apps/acme.json
        state: touch
        owner: rioly
        group: rioly
        mode: '0600'
        modification_time: preserve
        access_time: preserve

    - name: Copy Traefik static configuration
      ansible.builtin.copy:
        src: ../docker/traefik/traefik.yml
        dest: /home/rioly/apps/traefik.yml
        owner: rioly
        group: rioly
        mode: '0644'

    - name: Create external Docker proxy network
      community.docker.docker_network:
        name: proxy-net
        state: present

    - name: Copy central docker-compose.yml file
      ansible.builtin.copy:
        src: ../docker/docker-compose.yml
        dest: /home/rioly/apps/docker-compose.yml
        owner: rioly
        group: rioly
        mode: '0644'

    - name: Deploy Application Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: /home/rioly/apps
        state: present
